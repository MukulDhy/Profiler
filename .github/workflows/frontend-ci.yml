name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v7

      # 2. Setup Node.js (using 22, matching local development)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          # setup-node runs from the repo root, so point it at the frontend lockfile.
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Lint code
      # - run: npm run lint

      # 5. Build project
      - name: Build
        run: npm run build
