name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Needed to dispatch the portable-release build (releases published with
  # GITHUB_TOKEN do not fire their own `release: published` workflow).
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # There is no package.json at the repo root, so use the generic
          # strategy instead of the "node" one. The package name is derived
          # from the repository name ("release-please-action@v5" no longer
          # accepts a `package-name` input).
          release-type: simple

      # A release created with GITHUB_TOKEN does not emit a `release: published`
      # event, so start the portable build explicitly.
      - name: Build portable ZIP for the new release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --ref main -f tag="$TAG" -f publish=true
