name: "Close stale issues"

on:
  schedule:
    - cron: "0 0 * * 0" # weekly
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been automatically marked as stale because it has had no activity for 30 days. It will be closed in 7 days unless there is further activity."
          stale-pr-message: "This pull request has been automatically marked as stale because it has had no activity for 30 days. It will be closed in 7 days unless there is further activity."
          days-before-stale: 30
          days-before-close: 7
