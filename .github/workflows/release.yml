name: Build portable release

# Triggered when release-please publishes a release (which also creates the
# tag). Manual runs build the same ZIP as a downloadable workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version/tag to build (e.g. v1.0.0); used in the file name"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  windows-portable:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: AiAnalyser/requirements-light.txt

      # ── Frontend: static SPA build served by the bundled backend ──────────
      - name: Build desktop SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build:desktop

      # ── Backend: production dependencies only ─────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      # ── Python sidecar: light extraction, PyInstaller one-folder build ────
      - name: Install analyser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AiAnalyser/requirements-light.txt pyinstaller

      - name: Build analyser executable
        working-directory: AiAnalyser
        run: pyinstaller --clean --noconfirm profilegpt-analyser.spec

      # ── Assemble the portable folder ──────────────────────────────────────
      - name: Assemble portable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = "${{ github.event.release.tag_name || inputs.tag || 'v0.0.0-dev' }}"
          $version = $tag.TrimStart('v')
          $stage = "ProfileGPT-$version-win64"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          Write-Host "Assembling $stage"

          # Backend + production node_modules
          Copy-Item -Path 'backend' -Destination "$stage/backend" -Recurse
          $backendStage = Join-Path $stage 'backend'
          foreach ($item in @('.env', '.env.local', 'coverage', 'tests', 'uploads', 'logs', '.gitignore')) {
            $target = Join-Path $backendStage $item
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          }
          Get-ChildItem -Path $backendStage -Filter '*.test.js' -Recurse -File |
            Remove-Item -Force
          foreach ($item in @('jest.config.js', 'jest.config.cjs', 'jest.setup.js')) {
            $target = Join-Path $backendStage $item
            if (Test-Path $target) { Remove-Item $target -Force }
          }
          $cache = Join-Path $backendStage 'node_modules/.cache'
          if (Test-Path $cache) { Remove-Item $cache -Recurse -Force }

          # Static web build (TanStack Start SPA emits _shell.html)
          New-Item -ItemType Directory -Path "$stage/web" | Out-Null
          Copy-Item -Path 'frontend/dist/client/*' -Destination "$stage/web" -Recurse
          if (-not (Test-Path "$stage/web/_shell.html") -and
              -not (Test-Path "$stage/web/index.html")) {
            throw 'The web build is missing both _shell.html and index.html — the desktop build failed.'
          }

          # Bundled Node runtime
          New-Item -ItemType Directory -Path "$stage/runtime" | Out-Null
          $nodeExe = node -p "process.execPath"
          Copy-Item -Path $nodeExe -Destination "$stage/runtime/node.exe"

          # Python sidecar (PyInstaller one-folder output)
          if (-not (Test-Path 'AiAnalyser/dist/profilegpt-analyser')) {
            throw 'PyInstaller output missing: AiAnalyser/dist/profilegpt-analyser'
          }
          Copy-Item -Path 'AiAnalyser/dist/profilegpt-analyser' -Destination "$stage/ai" -Recurse

          # Launcher and helper scripts
          Copy-Item -Path 'desktop/launcher.js' -Destination $stage
          Copy-Item -Path 'desktop/Start ProfileGPT.bat' -Destination $stage
          Copy-Item -Path 'desktop/Start ProfileGPT.vbs' -Destination $stage
          Copy-Item -Path 'desktop/Stop ProfileGPT.bat' -Destination $stage
          Copy-Item -Path 'desktop/README.txt' -Destination $stage
          Copy-Item -Path 'LICENSE' -Destination $stage
          New-Item -ItemType File -Path "$stage/portable.flag" | Out-Null
          Set-Content -Path "$stage/version.txt" -Value $version -Encoding ascii

          # Tiny native launcher (uses the .NET Framework compiler that ships
          # with Windows, so no runtime needs to be installed).
          $csc = @(
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) { throw 'csc.exe (Windows .NET Framework) not found.' }

          # csc.exe mangles relative paths that use forward slashes, so hand it
          # an absolute Windows path.
          $launcherSource = (Resolve-Path 'desktop/ProfileGPTLauncher.cs').Path
          $launcherExe = (Join-Path (Resolve-Path $stage).Path 'ProfileGPT.exe')
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu `
            "/out:$launcherExe" /reference:System.Windows.Forms.dll `
            $launcherSource
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed ($LASTEXITCODE)." }

          # Never ship credentials, even if a tracked .env slips through.
          $leaks = Get-ChildItem -Path $stage -Recurse -Force -File |
            Where-Object { $_.Name -in @('.env', '.env.local', '.env.production') }
          if ($leaks) {
            throw "Secret files found in the bundle: $($leaks.FullName -join ', ')"
          }

          foreach ($required in @(
            "$stage/ProfileGPT.exe",
            "$stage/launcher.js",
            "$stage/portable.flag",
            "$stage/backend/app.js",
            "$stage/backend/node_modules/express/package.json",
            "$stage/web/assets",
            "$stage/runtime/node.exe",
            "$stage/ai/profilegpt-analyser.exe"
          )) {
            if (-not (Test-Path $required)) { throw "Missing from bundle: $required" }
          }
          if (-not (Test-Path "$stage/web/_shell.html") -and
              -not (Test-Path "$stage/web/index.html")) {
            throw 'The web build is missing both _shell.html and index.html.'
          }

          $zip = "$stage.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $stage.zip" -Encoding ascii

          $sizeMb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Built $zip ($sizeMb MB)"
          Write-Host "SHA256 $hash"

      - name: Upload to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $zip = Get-ChildItem -Path . -Filter 'ProfileGPT-*.zip' -File | Select-Object -First 1
          $sha = Get-ChildItem -Path . -Filter 'ProfileGPT-*.zip.sha256' -File | Select-Object -First 1
          if (-not $zip -or -not $sha) { throw 'Release files not found.' }
          gh release upload $tag $zip.FullName $sha.FullName --clobber

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ProfileGPT-portable-windows-x64
          path: |
            ProfileGPT-*.zip
            ProfileGPT-*.zip.sha256
          retention-days: 14
