# ─────────────────────────────────────────────────────────────────────────────
# ProfileGPT — LLM routing table
#
# The router walks `routing.primary` first, then `routing.fallback`, then any
# remaining configured provider. Providers without an API key are skipped.
# A request may override the route with `provider` / `model` form fields.
#
# `max_tokens` caps the generated output. Keep it explicit: some providers
# (notably OpenRouter) reserve credit for the model's maximum output window
# unless a smaller limit is requested, which fails with 402 on low balances.
# ─────────────────────────────────────────────────────────────────────────────

routing:
  primary: openrouter
  fallback: [google, openai]

providers:
  openrouter:
    type: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: google/gemini-2.5-flash
    timeout_s: 120
    temperature: 0.1
    max_tokens: 4096
    # OpenRouter proxies many models; function calling is the most portable
    # structured-output mode across them.
    structured_method: function_calling
    headers:
      HTTP-Referer: https://profilegpt.local
      X-Title: ProfileGPT

  google:
    type: google_genai
    api_key_env: GOOGLE_API_KEY
    model: gemini-2.5-flash
    timeout_s: 120
    temperature: 0.1
    max_tokens: 4096
    structured_method: json_schema

  openai:
    type: openai
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-mini
    timeout_s: 120
    temperature: 0.1
    max_tokens: 4096
    structured_method: json_schema
