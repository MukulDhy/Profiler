readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.142.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]
